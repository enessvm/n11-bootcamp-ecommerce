server:
  port: 8084

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}

# Keycloak admin + public-client config for the custom register/login flow
keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:ecommerce}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
    client-secret: ${USER_SERVICE_ADMIN_CLIENT_SECRET}
  public-client-id: ${KEYCLOAK_PUBLIC_CLIENT_ID:ecommerce-web}