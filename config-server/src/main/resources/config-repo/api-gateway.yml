server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/products/**,/categories/**
            - id: stock-service
              uri: lb://stock-service
              predicates:
                - Path=/stock/**
                - Method=PUT
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
            - id: promotion-service
              uri: lb://promotion-service
              predicates:
                - Path=/promotions/**
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/cart/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:5173}
                  - https://sandbox-api.iyzipay.com
                  - https://api.iyzipay.com
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600