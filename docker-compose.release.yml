name: ecommerce

x-service-base: &service-base
  restart: unless-stopped
  networks: [ecommerce-net]

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  CONFIG_URI: http://config-server:8888
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecommerce
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    <<: *service-base
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    <<: *service-base
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    <<: *service-base
    command: [start-dev, --import-realm]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTP_PORT: 8080
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  eureka-server:
    image: ghcr.io/enessvm/ecommerce/eureka-server:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    image: ghcr.io/enessvm/ecommerce/config-server:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      SPRING_PROFILES_ACTIVE: native
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: ghcr.io/enessvm/ecommerce/api-gateway:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_URI: http://config-server:8888
      FRONTEND_ORIGIN: https://chamomile-shelf-sierra.ngrok-free.dev
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  user-service:
    image: ghcr.io/enessvm/ecommerce/user-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      USER_SERVICE_ADMIN_CLIENT_SECRET: ${USER_SERVICE_ADMIN_CLIENT_SECRET}
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  product-service:
    image: ghcr.io/enessvm/ecommerce/product-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  stock-service:
    image: ghcr.io/enessvm/ecommerce/stock-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_db
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  promotion-service:
    image: ghcr.io/enessvm/ecommerce/promotion-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotion_db
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    image: ghcr.io/enessvm/ecommerce/payment-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL}
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    image: ghcr.io/enessvm/ecommerce/order-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cart-service:
    image: ghcr.io/enessvm/ecommerce/cart-service:${ECOMMERCE_VERSION}
    <<: *service-base
    environment:
      <<: *service-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart_db
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ghcr.io/enessvm/ecommerce/frontend:${ECOMMERCE_VERSION}
    <<: *service-base
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  keycloak-data:

networks:
  ecommerce-net:
    driver: bridge
